name: refresh
on:
  schedule:
    - cron: "17 3 * * *"       # daily, 01:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
env:
  LEADERBOARD_CONTACT: "lichess.org/@/RyanMiller1988"
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/refresh.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/data/leaderboard.json
          git diff --cached --quiet && exit 0
          git commit -m "refresh: $(date -u +%F)"
          git pull --rebase
          git push
